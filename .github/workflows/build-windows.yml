name: Build Windows + macOS

# Reliable path to a Windows .exe/.msi installer: Tauri's bundler (NSIS/WiX)
# only runs natively on Windows, so we build on a Windows runner.
# Push a tag like v0.1.0, or run manually from the Actions tab.
#
# R3: the audit job runs on every PR, push to main, and tag build.
# PRs run audit only (cheap gate); full Windows build stays on
# dispatch/main/tags. The release job needs audit, so a red audit
# blocks release attachment on tag builds.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# R4: read-only token by default. contents: write lives only in the `release`
# job below, which is skipped entirely on manual dispatch — so non-tag builds
# run end-to-end with a read-only token (AC R4.2).
permissions:
  contents: read

jobs:
  # R3: dependency vulnerability audits (cargo-audit + npm audit).
  # Ubuntu lane, parallel to the Windows build; adds ~1 min to the tag
  # critical path (well inside the +5 min release-latency budget).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install cargo-audit (prebuilt binary)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit

      # Gate: any high/critical in src-tauri/Cargo.lock fails the build
      # (cargo-audit has no prod/dev split — all lockfile deps gate, Q3).
      # Waivers: IDs listed in .github/cargo-audit.toml ([advisories] ignore,
      # each with reason + review-by comment) are subtracted from the gate but
      # stay visible in this log. Lower severities and unmaintained/yanked
      # warnings log as advisory only.
      - name: "Rust dependency audit (gate: high/critical fails)"
        run: |
          cargo audit --file src-tauri/Cargo.lock --json > cargo-audit.json || true
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open('cargo-audit.json'))
          except Exception as e:
              sys.exit(f'GATE: FAIL - cannot parse cargo-audit output ({e}); failing closed')
          waived = set()
          try:
              import tomllib
              cfg = tomllib.load(open('.github/cargo-audit.toml', 'rb'))
              waived = set(cfg.get('advisories', {}).get('ignore', []))
          except FileNotFoundError:
              pass
          except Exception as e:
              sys.exit(f'GATE: FAIL - malformed .github/cargo-audit.toml ({e})')
          print('Rust dependency audit — src-tauri/Cargo.lock')
          print('waived advisory IDs:', ', '.join(sorted(waived)) or 'none')
          vulns = (d.get('vulnerabilities') or {}).get('list') or []
          gate = []
          if vulns:
              print(f'{"ID":26} {"SEVERITY":9} {"PACKAGE":26} {"VERSION":10} TITLE')
              for v in vulns:
                  a, p = v.get('advisory') or {}, v.get('package') or {}
                  sev = (a.get('severity') or 'unknown').lower()
                  note = ' -> waived (reason + review-by in .github/cargo-audit.toml)' if a.get('id') in waived else ''
                  print(f'{a.get("id", "?"):26} {sev:9} {p.get("name", "?"):26} {p.get("version", ""):10} {a.get("title", "")}{note}')
                  if sev in ('high', 'critical') and a.get('id') not in waived:
                      gate.append(a.get('id'))
          else:
              print('no vulnerability entries')
          for kind, items in sorted((d.get('warnings') or {}).items()):
              for w in items or []:
                  a, p = w.get('advisory') or {}, w.get('package') or {}
                  print(f'[advisory-only:{kind}] {a.get("id", p.get("name", "?"))} — {a.get("title", "")}')
          if gate:
              print(f'GATE: FAIL — {len(gate)} high/critical in Cargo.lock: {" ".join(gate)}')
              sys.exit(1)
          print('GATE: PASS — 0 high/critical vulnerabilities in src-tauri/Cargo.lock')
          PY

      - name: Install frontend deps (lockfile-faithful)
        run: npm ci

      # Gate: high/critical in PRODUCTION dependencies fails (Q3). Waivable
      # via .github/npm-audit-waivers.txt (one advisory ID per line, with
      # reason + review-by). Dev-only findings do not gate.
      - name: "npm audit — production gate (high/critical fails)"
        run: |
          npm audit --omit=dev --json > npm-audit-prod.json || true
          python3 - <<'PY'
          import json, re, sys
          try:
              d = json.load(open('npm-audit-prod.json'))
          except Exception as e:
              sys.exit(f'GATE: FAIL - cannot parse npm audit output ({e}); failing closed')
          waived = set()
          try:
              waiver_lines = open('.github/npm-audit-waivers.txt').readlines()
          except FileNotFoundError:
              waiver_lines = []
          for line in waiver_lines:
              tok = line.split('#')[0].strip()
              if tok:
                  waived.add(tok.split()[0])
          print('npm audit — production dependencies (--omit=dev)')
          print('waived advisory IDs:', ', '.join(sorted(waived)) or 'none')
          gate = []
          for name, v in sorted((d.get('vulnerabilities') or {}).items()):
              sev = v.get('severity', '?')
              ids = set()
              for via in v.get('via', []):
                  if isinstance(via, dict):
                      for s in re.findall(r'GHSA-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}|CVE-\d{4}-\d{4,}', json.dumps(via), re.I):
                          ids.add(s)
              fix = v.get('fixAvailable')
              print(f'  {name} — {sev} — {", ".join(sorted(ids)) or "?"} — ' +
                    ('fix available' if fix else 'no fix available'))
              if sev in ('high', 'critical'):
                  if ids and ids <= waived:
                      print('    -> waived (reason + review-by in .github/npm-audit-waivers.txt)')
                  else:
                      gate.append(f'{name}({sev})')
          if gate:
              print(f'GATE: FAIL — {len(gate)} high/critical in production deps: {", ".join(gate)}')
              sys.exit(1)
          print('GATE: PASS — 0 unwaived high/critical vulnerabilities in production dependencies')
          PY

      # Advisory lane (Q3/TSD 3.3): full audit incl. dev chain — logged, never blocks.
      - name: npm audit — full report (advisory only)
        continue-on-error: true
        run: npm audit

  build:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      # Rust lib tests on a real Windows host (the bin target has 0 tests;
      # the suite lives in hosterm_lib). A red test fails the build before
      # any installer is produced.
      - name: Rust lib tests (cargo test --lib)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
        shell: bash

      # Headless DOM smoke: build the frontend first (the harness serves
      # ../dist and mocks the Tauri IPC), install Playwright + its Chromium,
      # then run the smoke suite on Windows. A failing check exits non-zero
      # and fails the build.
      - name: Build frontend for smoke
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
        shell: bash

      - name: Headless DOM smoke
        # pipefail so the node exit code (not tee's) decides pass/fail.
        run: set -o pipefail; node qa-reports/headless-smoke.mjs 2>&1 | tee smoke-output.txt
        shell: bash

      # Always upload the smoke log so a Windows-only failure is diagnosable
      # without repo-admin access to the raw CI logs. No secrets in this output.
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-output
          if-no-files-found: warn
          path: smoke-output.txt

      - name: Build Tauri app (produces .msi and NSIS .exe)
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosterm-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # macOS universal (.app + .dmg). Same cargo + smoke gate as the Windows job;
  # a red test/smoke fails before any bundle is produced. The .dmg is UNSIGNED
  # (no Apple Developer cert), so Gatekeeper quarantines it on first open —
  # users right-click > Open, or `xattr -dr com.apple.quarantine hosterm.app`.
  build-macos:
    # Temporarily disabled (MEKL, 2026-11-04): skip macOS build for now.
    # Re-enable by restoring: if: github.event_name != 'pull_request'
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Rust (both macOS arches for a universal binary)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Rust lib tests (cargo test --lib)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build frontend for smoke
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium

      - name: Headless DOM smoke
        run: set -o pipefail; node qa-reports/headless-smoke.mjs 2>&1 | tee smoke-output-macos.txt

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-output-macos
          if-no-files-found: warn
          path: smoke-output-macos.txt

      - name: Build Tauri app (universal .app + .dmg)
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosterm-macos
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # R4: the only job holding contents: write. Tag-gated, so manual dispatch
  # never grants write to any step. R3: also needs the audit job, so a red
  # audit gate blocks release attachment.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download installers (all platforms)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # no `name:` => download every artifact (hosterm-windows + hosterm-macos),
          # each into its own subdir. The **/ glob below matches them at any depth.
          path: dist-artifacts

      - name: Extract curated release notes
        run: python3 scripts/extract-release-notes.py "${{ github.ref_name }}" release-notes.md

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # v0.9.0 repair: upload-artifact v4 nests paths under their LCA,
          # so after download-artifact the installers are NOT at repo root.
          # **/ matches any depth; fail_on_unmatched_files is per-pattern,
          # so mixed-depth pattern lists self-defeat (second tag run failed
          # exactly that way). Fail loudly instead of shipping an asset-less
          # release (first v0.9.0 tag shipped zero assets).
          fail_on_unmatched_files: true
          body_path: release-notes.md
          # macOS .dmg temporarily disabled (build-macos job skipped, 2026-11-04);
          # when re-enabling the macOS build, add `**/*.dmg` to the files list below.
          # NOTE: lines under `files: |` are literal file patterns, NOT YAML comments —
          # a `#` line there is matched as a filename and fails fail_on_unmatched_files.
          files: |
            **/*.msi
            **/*.exe
