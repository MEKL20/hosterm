[package]
name = "hosterm"
version = "0.5.2"
description = "SSH client desktop, source of truth = ~/.ssh/config"
authors = ["MEKL20"]
edition = "2021"

[lib]
name = "hosterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
portable-pty = "0.8"
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
