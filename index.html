<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hosterm</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-head">
          <span class="brand">hosterm</span>
          <button id="btn-add" title="Add host">+</button>
        </div>
        <div id="host-list"></div>
        <div class="sidebar-foot">
          <button id="btn-raw">Raw config</button>
          <button id="btn-reload" title="Reload ~/.ssh/config">⟳</button>
        </div>
      </aside>

      <main id="main">
        <div id="tabs"></div>
        <div id="panels"></div>
      </main>
    </div>

    <!-- Host editor modal -->
    <div id="modal" class="hidden">
      <div class="modal-box">
        <h2 id="modal-title">Add host</h2>
        <label>Alias (Host)<input id="f-name" placeholder="my-server" /></label>
        <label>HostName<input id="f-hostname" placeholder="203.0.113.10 or example.com" /></label>
        <label>User<input id="f-user" placeholder="root" /></label>
        <label>Port<input id="f-port" placeholder="22" /></label>
        <label>Authentication
          <select id="f-auth">
            <option value="key">Key (IdentityFile)</option>
            <option value="password">Password (prompt on connect)</option>
          </select>
        </label>
        <div id="row-identity">
          <label>Identity key
            <div class="id-row">
              <select id="f-identity"></select>
              <button type="button" id="f-newkey" title="Paste a private key">New key…</button>
            </div>
          </label>
        </div>
        <p id="row-password-note" class="note hidden">
          No password is stored. ssh will prompt for it in the terminal each
          time you connect — your <code>~/.ssh/config</code> stays portable.
        </p>
        <div class="modal-actions">
          <button id="m-delete" class="danger hidden">Delete</button>
          <span class="spacer"></span>
          <button id="m-cancel">Cancel</button>
          <button id="m-save" class="primary">Save</button>
        </div>
        <p id="modal-err" class="err"></p>
      </div>
    </div>

    <!-- Raw config modal -->
    <div id="raw-modal" class="hidden">
      <div class="modal-box wide">
        <h2>~/.ssh/config</h2>
        <textarea id="raw-text" spellcheck="false"></textarea>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button id="raw-cancel">Cancel</button>
          <button id="raw-save" class="primary">Save file</button>
        </div>
        <p id="raw-err" class="err"></p>
      </div>
    </div>

    <!-- Create identity key modal -->
    <div id="key-modal" class="hidden">
      <div class="modal-box">
        <h2>New identity key</h2>
        <label>Key file name<input id="k-name" placeholder="id_myserver" /></label>
        <label>Private key (paste)
          <textarea id="k-text" spellcheck="false"
            placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----"></textarea>
        </label>
        <p class="note">
          Saved to <code>~/.ssh/&lt;name&gt;</code> with <code>0600</code>
          permissions, then selectable above.
        </p>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button id="k-cancel">Cancel</button>
          <button id="k-save" class="primary">Save key</button>
        </div>
        <p id="key-err" class="err"></p>
      </div>
    </div>
  </body>
</html>
