<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hosterm</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-head">
          <span class="brand">hosterm</span>
          <span class="head-acts">
            <button id="btn-add" class="icon" aria-label="Add host" title="Add host">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="2" x2="10" y2="6"/><line x1="8" y1="4" x2="12" y2="4"/></svg>
            </button>
            <button id="btn-collapse" class="icon" aria-label="Collapse sidebar" title="Collapse sidebar">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,3 11,8 6,13"/></svg>
            </button>
          </span>
        </div>
        <input id="host-search" type="search" placeholder="Search hosts…" aria-label="Search hosts" />
        <div id="host-list"></div>
        <button id="btn-expand" class="hidden" aria-label="Expand sidebar" title="Expand sidebar">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="10,3 5,8 10,13"/></svg>
        </button>
        <div class="sidebar-foot">
          <button id="btn-raw">Raw config</button>
          <button id="btn-reload" class="icon" aria-label="Reload config" title="Reload config">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.7-3.75"/><polyline points="13,1.5 13,4.5 10,4.5"/></svg>
          </button>
        </div>
      </aside>

      <main id="main">
        <div id="tabs" role="tablist"></div>
        <div id="panels"></div>
      </main>
    </div>

    <!-- Host editor modal -->
    <div id="modal" class="hidden">
      <div class="modal-box">
        <h2 id="modal-title">Add host</h2>
        <label>Alias (Host)<input id="f-name" placeholder="my-server" /></label>
        <label>HostName<input id="f-hostname" placeholder="203.0.113.10 or example.com" /></label>
        <label>User<input id="f-user" placeholder="root" /></label>
        <label>Port<input id="f-port" placeholder="22" /></label>
        <label>Authentication
          <select id="f-auth">
            <option value="key">Key (IdentityFile)</option>
            <option value="password">Password</option>
          </select>
        </label>
        <div id="row-identity">
          <label>Identity key
            <div class="id-row">
              <select id="f-identity"></select>
              <button type="button" id="f-newkey">New key</button>
            </div>
          </label>
        </div>
        <div id="row-password" class="hidden">
          <label>Password
            <input id="f-password" type="password" placeholder="stored in ~/.ssh/config" autocomplete="off" />
          </label>
          <p class="note" id="row-password-note"></p>
        </div>
        <div class="modal-actions">
          <button id="m-delete" class="danger hidden">Delete</button>
          <span class="spacer"></span>
          <button id="m-cancel">Cancel</button>
          <button id="m-save" class="primary">Save</button>
        </div>
        <p id="modal-err" class="err"></p>
      </div>
    </div>

    <!-- Raw config modal -->
    <div id="raw-modal" class="hidden">
      <div class="modal-box wide">
        <h2>~/.ssh/config</h2>
        <textarea id="raw-text" spellcheck="false"></textarea>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button id="raw-cancel">Cancel</button>
          <button id="raw-save" class="primary">Save file</button>
        </div>
        <p id="raw-err" class="err"></p>
      </div>
    </div>

    <!-- Create identity key modal -->
    <div id="key-modal" class="hidden">
      <div class="modal-box">
        <h2>New identity key</h2>
        <label>Key file name<input id="k-name" placeholder="id_myserver" /></label>
        <label>Private key (paste)
          <textarea id="k-text" spellcheck="false"
            placeholder="[REDACTED PRIVATE KEY]"></textarea>
        </label>
        <p class="note">
          Saved to <code>~/.ssh/&lt;name&gt;</code> with <code>0600</code>
          permissions, then selectable above.
        </p>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button id="k-cancel">Cancel</button>
          <button id="k-save" class="primary">Save key</button>
        </div>
        <p id="key-err" class="err"></p>
      </div>
    </div>

    <!-- In-app dialog -->
    <div id="dialog" class="hidden">
      <div class="modal-box dialog-box">
        <h2 id="dialog-title"></h2>
        <p id="dialog-msg"></p>
        <div id="dialog-actions" class="modal-actions"></div>
      </div>
    </div>
  </body>
</html>
